```ini
# ─────────────────────────────────────────────
# HYPRLOCK
# Catppuccin / Purple Glass
# ─────────────────────────────────────────────

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    text_trim = true

    fail_timeout = 2000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
}

# ─────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────

background {
    monitor =
    path = screenshot
    color = rgba(17, 17, 27, 1.0)

    blur_passes = 3
    blur_size = 8
    noise = 0.0117

    brightness = 0.65
}

# ─────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(205, 214, 244, 1.0)

    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 110
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.8)
}

# ─────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d. %B %Y')"
    color = rgba(166, 173, 200, 1.0)

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 15
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# USERNAME
# ─────────────────────────────────────────────

label {
    monitor =
    text = $USER
    color = rgba(203, 166, 247, 1.0)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -120
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# PASSWORD FIELD
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 320, 60
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true

    outer_color = rgba(203, 166, 247, 0.35)
    inner_color = rgba(24, 24, 37, 0.92)
    font_color = rgba(205, 214, 244, 1.0)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    hide_input = false

    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    fail_text = <i>Authentication failed</i>

    rounding = 14

    position = 0, -205
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.8)
}

# ─────────────────────────────────────────────
# LOCK ICON / STATUS
# ─────────────────────────────────────────────

label {
    monitor =
    text = "󰌾"
    color = rgba(203, 166, 247, 0.9)

    font_size = 28
    font_family = JetBrainsMono Nerd Font

    position = 0, -285
    halign = center
    valign = center
}
```

